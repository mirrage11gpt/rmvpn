name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o target/risevpn-node ./cmd/risevpn-node
      - run: go build -trimpath -o target/risevpn-mock-controller ./cmd/risevpn-mock-controller
      - run: go build -trimpath -o target/risevpn-control ./cmd/risevpn-control
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck install.sh packaging/risevpn-node-admin packaging/risevpn-cert-* scripts/*.sh deploy/*.sh

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f Dockerfile.control .

  hysteria-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false
      - name: Clone pinned upstream and apply ordered patches
        run: |
          tag=$(head -n1 hysteria-patches/UPSTREAM_VERSION)
          git clone --depth 1 --branch "$tag" https://github.com/apernet/hysteria.git /tmp/hysteria
          for patch in hysteria-patches/*.patch; do
            git -C /tmp/hysteria apply --check "$GITHUB_WORKSPACE/$patch"
            git -C /tmp/hysteria apply "$GITHUB_WORKSPACE/$patch"
          done
      - run: cd /tmp/hysteria/core && go test ./server
      - run: cd /tmp/hysteria/extras && go test ./auth -run '^$'
      - run: cd /tmp/hysteria/app && CGO_ENABLED=0 go build -trimpath .
